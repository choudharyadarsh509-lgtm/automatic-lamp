<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendyBazaar - Home</title>
<style>
  body { font-family: Arial; margin:0; background:#fff0f5; }
  header { background:#ff1493; color:white; padding:15px; text-align:center; position:sticky; top:0; z-index:100; }
  header h1 { margin:0; }
  nav a { color:white; margin:0 15px; text-decoration:none; font-weight:bold; }
  .search-bar { margin:10px auto; display:flex; justify-content:center; }
  .search-bar input { width:60%; padding:8px; border-radius:8px; border:1px solid #ff1493; }
  .search-bar button { padding:8px 15px; background:#ff1493; color:white; border:none; border-radius:8px; cursor:pointer; margin-left:5px; }
  .search-bar button:hover { background:#c71585; }
  .categories { display:flex; justify-content:center; gap:15px; margin:20px 0; flex-wrap:wrap; }
  .categories button { padding:10px 15px; background:#ffe4e1; border:none; border-radius:10px; cursor:pointer; }
  .categories button:hover { background:#ffb6c1; }
  .products { display:flex; justify-content:center; flex-wrap:wrap; gap:20px; }
  .product { background:#ffe4e1; padding:15px; border-radius:10px; width:200px; text-align:center; }
  .product img { width:150px; height:150px; object-fit:cover; border-radius:8px; }
  .product button { background:#ff1493; color:white; border:none; padding:8px; border-radius:8px; cursor:pointer; margin-top:10px; }
  .product button:hover { background:#c71585; }
  @media(max-width:600px){ .products, .categories { flex-direction:column; align-items:center; } .search-bar input { width:70%; } }
</style>
</head>
<body>

<header>
  <h1>TrendyBazaar</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search products...">
  <button onclick="searchProducts()">Search</button>
</div>

<div class="categories">
  <button onclick="filterCategory('Clothing')">Clothing</button>
  <button onclick="filterCategory('Footwear')">Footwear</button>
  <button onclick="filterCategory('Accessories')">Accessories</button>
  <button onclick="filterCategory('All')">All</button>
</div>

<div class="products" id="productContainer"></div>

<script>
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  document.getElementById('cart-count').textContent = cart.length;

  const products = [
    {name:'Trendy Shirt', price:499, category:'Clothing', img:'https://via.placeholder.com/150?text=Shirt'},
    {name:'Stylish Shoes', price:999, category:'Footwear', img:'https://via.placeholder.com/150?text=Shoes'},
    {name:'Cool Sunglasses', price:299, category:'Accessories', img:'https://via.placeholder.com/150?text=Sunglasses'},
    {name:'Jeans', price:799, category:'Clothing', img:'https://via.placeholder.com/150?text=Jeans'},
    {name:'Sneakers', price:1200, category:'Footwear', img:'https://via.placeholder.com/150?text=Sneakers'},
    {name:'Cap', price:199, category:'Accessories', img:'https://via.placeholder.com/150?text=Cap'}
  ];

  const container = document.getElementById('productContainer');

  function displayProducts(list) {
    container.innerHTML = '';
    list.forEach(product => {
      const div = document.createElement('div');
      div.className = 'product';
      div.innerHTML = `<img src="${product.img}" alt="${product.name}">
                       <h3>${product.name}</h3>
                       <p>₹${product.price}</p>
                       <button onclick="viewProduct('${product.name}',${product.price},'${product.category}','${product.img}')">View Details</button>`;
      container.appendChild(div);
    });
  }

  function viewProduct(name,price,category,img){
    window.location.href = `product.html?name=${encodeURIComponent(name)}&price=${price}&category=${category}&img=${encodeURIComponent(img)}`;
  }

  function filterCategory(cat){
    if(cat==='All') displayProducts(products);
    else displayProducts(products.filter(p=>p.category===cat));
  }

  function searchProducts(){
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    displayProducts(products.filter(p=>p.name.toLowerCase().includes(keyword)));
  }

  displayProducts(products);
</script>

</body>
</html>
